name: Telemetry Sync Worker

on:
  schedule:
    # Sabado e Domingo: Partida antecipada em minutos fora de pico (:47 e :17) para garantir maquina pronta antes das 08:30 BRT!
    - cron: '47 10 * * 6,0'
    - cron: '17 11 * * 6,0'
    - cron: '32 11 * * 6,0'
    - cron: '17 12 * * 6,0'
    - cron: '47 13 * * 6,0'
    - cron: '47 16 * * 6,0'
    - cron: '47 18 * * 6,0'
    # Todos os dias: Janela Almoco (partida antecipada as 11:47 BRT + 12:17 BRT + 12:32 BRT)
    - cron: '47 14 * * *'
    - cron: '17 15 * * *'
    - cron: '32 15 * * *'
    # Todos os dias: Janela Noite e Madrugada (partida antecipada as 17:47 BRT + 18:17, 18:32, 20:32, 22:32, 23:32 BRT)
    - cron: '47 20 * * *'
    - cron: '17 21 * * *'
    - cron: '32 21 * * *'
    - cron: '32 23 * * *'
    - cron: '32 1 * * *'
    - cron: '32 2 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duracao em minutos ou "auto" para calcular pelo relogio de Brasilia'
        required: true
        default: 'auto'

permissions:
  actions: write
  contents: read

concurrency:
  group: dvr-telemetry-worker
  cancel-in-progress: false

jobs:
  record-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep Cron Schedule Alive (Anti 60-day GitHub Expiration)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/dvr_schedule.yml/enable" >/dev/null 2>&1 || true

      - name: Setup Environment & Dependencies
        env:
          SSH_KEY_DATA: ${{ secrets.SSH_PRIVATE_KEY }}
          RCLONE_CONF_DATA: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone openssh-client
          pip install --quiet av pillow
          mkdir -p ~/.ssh ~/.config/rclone
          printf '%s\n' "$SSH_KEY_DATA" > ~/.ssh/id_target
          chmod 600 ~/.ssh/id_target
          printf '%s\n' "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Connect to Tailscale Mesh
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-dns=false

      - name: Run DVR Recorder with Watchdog
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          SSH_KEY_PATH: /home/runner/.ssh/id_target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DUR="${{ github.event.inputs.duration_minutes }}"
          else
            DUR="auto"
          fi
          python3 cloud_recorder.py --duration-minutes "$DUR"

      - name: Auto-Relay Handoff (Continua plantao de 17h ate 01:05 AM sem pausa)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/trigger_next_relay ]; then
            echo "Disparando proxima maquina de revezamento imediatamente para continuar ate 01:05 da madrugada..."
            gh workflow run dvr_schedule.yml -f duration_minutes=auto --repo "${{ github.repository }}" || true
          fi

      - name: Emergency Final GDrive Sweep (Redundancy)
        if: always()
        run: |
          if [ -d "recordings" ] && [ -n "$(find recordings -name '*.mp4' 2>/dev/null)" ]; then
            echo "Arquivos MP4 remanescentes detectados. Executando varredura final (rclone move) para o Google Drive..."
            rclone move recordings/ gdrive:CCTV_Vivobook/ --transfers=1 --retries=5 --low-level-retries=10 --delete-empty-src-dirs || true
          fi

      - name: Ultimate Fallback to GitHub Artifact (If GDrive Outage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallback-dvr-recordings-${{ github.run_id }}
          path: recordings/**/*.mp4
          if-no-files-found: ignore
          retention-days: 7
