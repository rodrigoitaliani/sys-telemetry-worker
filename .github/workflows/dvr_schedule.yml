name: Telemetry Sync Worker

on:
  schedule:
    # 12:30 BRT (15:30 UTC) - Sessao Almoco (12h30 as 13h35 BRT)
    - cron: '30 15 * * *'
    # 18:30 BRT (21:30 UTC) - Sessao Noite Turno 1 (18h30 as 22h30 BRT - 4h)
    - cron: '30 21 * * *'
    # 22:30 BRT (01:30 UTC) - Sessao Noite Turno 2 / Madrugada (22h30 as 01h05 BRT - 2h35m)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duracao da gravacao em minutos (ex: 10 para teste, 60 para 1h, 300 para 5h)'
        required: true
        default: '15'

permissions:
  actions: write
  contents: read

concurrency:
  group: dvr-telemetry-worker
  cancel-in-progress: false

jobs:
  record-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep Cron Schedule Alive (Anti 60-day GitHub Expiration)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/dvr_schedule.yml/enable" >/dev/null 2>&1 || true

      - name: Connect to Tailscale Mesh
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Setup Environment & Dependencies
        env:
          SSH_KEY_DATA: ${{ secrets.SSH_PRIVATE_KEY }}
          RCLONE_CONF_DATA: ${{ secrets.GDRIVE_RCLONE_CONF }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone openssh-client
          pip install --quiet av pillow
          mkdir -p ~/.ssh ~/.config/rclone
          printf '%s\n' "$SSH_KEY_DATA" > ~/.ssh/id_target
          chmod 600 ~/.ssh/id_target
          printf '%s\n' "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Run DVR Recorder with Watchdog
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_USER: ${{ secrets.TARGET_USER }}
          SSH_KEY_PATH: /home/runner/.ssh/id_target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DUR="${{ github.event.inputs.duration_minutes }}"
          elif [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
            DUR="65"
          elif [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then
            DUR="240"
          else
            DUR="155"
          fi
          python3 cloud_recorder.py --duration-minutes "$DUR"

      - name: Emergency Final GDrive Sweep (Redundancy)
        if: always()
        run: |
          if [ -d "recordings" ] && [ -n "$(find recordings -name '*.mp4' 2>/dev/null)" ]; then
            echo "Arquivos MP4 remanescentes detectados. Executando varredura final (rclone move) para o Google Drive..."
            rclone move recordings/ gdrive:CCTV_Vivobook/ --transfers=1 --retries=5 --low-level-retries=10 --delete-empty-src-dirs || true
          fi

      - name: Ultimate Fallback to GitHub Artifact (If GDrive Outage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallback-dvr-recordings-${{ github.run_id }}
          path: recordings/**/*.mp4
          if-no-files-found: ignore
          retention-days: 7
